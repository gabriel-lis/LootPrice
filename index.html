<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LootPrice</title>
  <link rel="stylesheet" href="css_index/lootprice.css">
  <link rel="stylesheet" href="css_index/responsive.css">
  <link rel="shortcut icon" href="fotos/extras/logoltdark.png" type="image/png">
</head>

<body>
  <div class="navbar">
    <div class="left-section">
      <button id="menu-btn" class="menu-btn">☰</button>
      <a href="index.html" target="_top">
        <img id="lootprice-logo" src="fotos/extras/logoltdark.png" alt="LootPrice">
      </a>
    </div>

    <div class="search-container">
      <label for="searchBar" class="visually-hidden"></label>
      <input type="text" id="searchBar" class="search-input" placeholder="Pesquisar jogo..."
        aria-label="Pesquisar jogos">
    </div>

    <!-- Área de autenticação: renderizada por js_index/auth.js usando localStorage.loggedUser -->
    <div id="auth-area" class="auth-buttons">
      <button id="theme-toggle" class="btn-theme" aria-label="Alternar tema">
        <img src="fotos/extras/dark-mode.png" alt="Tema" class="theme-icon">
      </button>
      <!-- Fallback estático: caso o script não execute, os links ainda aparecem -->
      <a href="sites/login/login.html" target="_blank" class="btn-login">Entrar</a>
      <a href="sites/login/cadastro.html" target="_blank" class="btn-login">Registrar</a>
    </div>
  </div>

  <nav id="sidebar" class="sidebar" role="navigation" aria-label="Menu principal">
    <div class="sidebar-top">
      <button id="sidebar-close" class="menu-close" aria-label="Fechar menu">✕</button>
    </div>

    <div class="sidebar-search" role="search">
      <input type="text" id="sidebarSearchBar" class="search-input" placeholder="Pesquisar jogo..."
        aria-label="Pesquisar jogos">
      <button id="sidebarSearchBtn" aria-label="Pesquisar">
        <img src="fotos/extras/search.png" alt="Pesquisar" class="sidebar-search-icon">
      </button>
    </div>

    <!-- Seletor de categoria: botão que abre um dropdown compacto acima de 'Sobre LootPrice' -->
    <div class="sidebar-category" style="position:relative;">
      <label for="categorySelect" class="visually-hidden">Categoria</label>
      <button id="categoryBtn" class="category-btn" aria-haspopup="listbox" aria-expanded="false">Categorias ▾</button>

      <!-- Mantemos o select por acessibilidade (escondido visualmente) -->
      <select id="categorySelect" aria-label="Filtrar por categoria"
        style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;">
        <option value="all">Todas</option>
        <option value="rpg">RPG</option>
        <option value="shooter">Shooter</option>
        <option value="battle-royale">Battle Royale</option>
        <option value="adventure">Aventura</option>
        <option value="terror">Terror</option>
        <option value="roguelike">Roguelike</option>
        <option value="soulslike">Soulslike</option>
        <option value="mmo rpg">MMO RPG</option>
        <option value="multiplayer">Multiplayer</option>
      </select>

      <!-- Dropdown visual compacto (aparece abaixo do botão) -->
      <div id="categoryDropdown" class="category-dropdown" role="listbox" aria-labelledby="categoryBtn"
        aria-hidden="true">
        <button class="category-option" data-value="all" role="option">Todas</button>
        <button class="category-option" data-value="rpg" role="option">RPG</button>
        <button class="category-option" data-value="shooter" role="option">Shooter</button>
        <button class="category-option" data-value="battle-royale" role="option">Battle Royale</button>
        <button class="category-option" data-value="adventure" role="option">Aventura</button>
        <button class="category-option" data-value="terror" role="option">Terror</button>
        <button class="category-option" data-value="roguelike" role="option">Roguelike</button>
        <button class="category-option" data-value="soulslike" role="option">Soulslike</button>
        <button class="category-option" data-value="mmo rpg" role="option">MMO RPG</button>
        <button class="category-option" data-value="multiplayer" role="option">Multiplayer</button>
      </div>
    </div>

    <a href="index.html">Início</a>
    <a href="sobre.html">Sobre LootPrice</a>
  </nav>

  <div id="sidebar-backdrop" class="sidebar-backdrop" tabindex="-1"></div>

  <!-- Hero / destaque principal -->
  <section class="hero" aria-label="Destaque LootPrice">
    <div class="hero-content">
      <h1 class="hero-title">O melhor preço.</h1>
      <p class="hero-subtitle">Todos os jogos. Um só lugar.</p>
      <div class="hero-cta">
        <a href="#" class="btn-login">Ver catálogo</a>
        <a href="sites/jogos/frame.html" class="btn-cta">Destaques</a>
      </div>
    </div>
  </section>

  <div class="catalogo">
    <a href="sites/jogos/ds.html" data-category="adventure"><img src="fotos/jogos/ds.jpg" alt="Death Stranding"
        width="140" height="190" loading="lazy" decoding="async"></a>
    <a href="sites/jogos/r6.html" data-category="shooter"><img src="fotos/jogos/r6.jpg" alt="Rainbow Six Siege"
        width="140" height="190" loading="lazy" decoding="async"></a>
    <a href="sites/jogos/apex.html" data-category="battle-royale"><img src="fotos/jogos/apex.jpg" alt="Apex Legends"
        width="140" height="190" loading="lazy" decoding="async"></a>
    <a href="sites/jogos/dbd.html" data-category="terror, multiplayer"><img src="fotos/jogos/dbd.png"
        alt="Dead by Daylight" width="140" height="190" loading="lazy" decoding="async"></a>
    <a href="sites/jogos/er.html" data-category="rpg, soulslike"><img src="fotos/jogos/er.jpg" alt="Elden Ring" width="140"
        height="190" loading="lazy" decoding="async"></a>
    <a href="sites/jogos/ror.html" data-category="roguelike"><img src="fotos/jogos/ror2.jpg" alt="Risk of Rain 2"
        width="140" height="190" loading="lazy" decoding="async"></a>
    <a href="sites/jogos/sot.html" data-category="multiplayer"><img src="fotos/jogos/sot.jpg" alt="Sea of Thieves"
        width="140" height="190" loading="lazy" decoding="async"></a>
    <a href="sites/jogos/frame.html" data-category="mmo rpg"><img src="fotos/jogos/warframe.png" alt="Warframe" width="140"
        height="190" loading="lazy" decoding="async"></a>
    <a href="sites/jogos/witcher.html" data-category="rpg"><img src="fotos/jogos/witcher.jpg" alt="The Witcher 3"
        width="140" height="190" loading="lazy" decoding="async"></a>
    <a href="sites/jogos/ds3.html" data-category="rpg"><img src="fotos/jogos/ds3.png" alt="Dark Souls 3" width="140"
        height="190" loading="lazy" decoding="async"></a>
  </div>

  <footer>
    <p>&copy; 2025 - LootPrice - Todos os direitos reservados</p>
  </footer>

  <script src="js_index/pesquisa.js" defer></script>
  <script src="js_index/darkmode.js" defer></script>
  <script src="js_index/menulateral.js" defer></script>
  <script src="js_index/auth.js" defer></script>
</body>

</html>
