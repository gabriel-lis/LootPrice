<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin — LootPrice</title>
    <link rel="stylesheet" href="../../css_index/lootprice.css">
    <link rel="stylesheet" href="../../css_index/responsive.css">
    <style>
        .admin-container {
            max-width: 1100px;
            margin: 20px auto;
            padding: 20px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .admin-title {
            font-size: 20px;
            font-weight: 800;
        }

        table.admin-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.02);
        }

        table.admin-table th,
        table.admin-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        table.admin-table th {
            font-weight: 700;
            color: var(--text-color);
        }

        .action-btn {
            margin-right: 8px;
            padding: 6px 10px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 700;
        }

        .action-edit {
            background: linear-gradient(90deg, #ffc857, #ff7b54);
            color: #111;
        }

        .action-delete {
            background: linear-gradient(90deg, #ff6b6b, #ff4757);
            color: #fff;
        }

        .action-save {
            background: linear-gradient(90deg, #5ee7df, #b6ffdd);
            color: #111;
        }

        .action-cancel {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-color);
        }

        .no-users {
            padding: 24px;
            text-align: center;
            color: var(--text-color);
        }

        .user-input {
            width: 100%;
            padding: 6px 8px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-color);
            border-radius: 6px;
        }

        .admin-note {
            font-size: 13px;
            color: var(--search-placeholder);
            margin-bottom: 8px;
        }
    </style>
</head>

<body>
    <!-- Navbar (copiado simplificado do index) -->
    <div class="navbar">
        <div class="left-section">
            <button id="menu-btn" class="menu-btn">☰</button>
            <a href="../../index.html" target="_top">
                <img id="lootprice-logo" src="../../fotos/extras/logoltdark.png" alt="LootPrice">
            </a>
        </div>

        <div class="search-container">
            <input type="text" id="searchBar" class="search-input" placeholder="Pesquisar jogo..."
                aria-label="Pesquisar jogos">
        </div>

        <div id="auth-area" class="auth-buttons">
            <button id="theme-toggle" class="btn-theme" aria-label="Alternar tema">
                <img src="../../fotos/extras/dark-mode.png" alt="Tema" class="theme-icon">
            </button>
        </div>
    </div>

    <nav id="sidebar" class="sidebar" role="navigation" aria-label="Menu principal">
        <div class="sidebar-top">
            <button id="sidebar-close" class="menu-close" aria-label="Fechar menu">✕</button>
        </div>

        <div class="sidebar-search" role="search">
            <input type="text" id="sidebarSearchBar" class="search-input" placeholder="Pesquisar jogo..."
                aria-label="Pesquisar jogos">
            <button id="sidebarSearchBtn" aria-label="Pesquisar">
                <img src="../../fotos/extras/search.png" alt="Pesquisar" class="sidebar-search-icon">
            </button>
        </div>

        <a href="../../index.html">Início</a>
        <a href="../../sobre.html">Sobre LootPrice</a>
        <!-- O link Admin será adicionado dinamicamente caso o usuário seja admin -->
    </nav>

    <div id="sidebar-backdrop" class="sidebar-backdrop" tabindex="-1"></div>

    <main class="admin-container">
        <div class="admin-header">
            <div>
                <div class="admin-title">Painel de Administração</div>
                <div class="admin-note">Aqui você pode visualizar, editar e remover usuários armazenados no
                    localStorage.</div>
            </div>
        </div>

        <section id="users-area">
            <!-- tabela de usuários será injetada pelo JS -->
        </section>
    </main>

    <footer>
        <p>&copy; 2025 - LootPrice - Todos os direitos reservados</p>
    </footer>

    <script src="../../js_index/darkmode.js" defer></script>
    <script src="../../js_index/menulateral.js" defer></script>
    <script src="../../js_index/auth.js" defer></script>
    <script src="js_admin/admin.js" defer></script>
</body>

</html>
